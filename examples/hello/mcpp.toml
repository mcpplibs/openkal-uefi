[package]
name    = "hello"
version = "0.2.0"

[targets.hello]
kind = "bin"
main = "src/main.cpp"

[dependencies]
openkal = "^0.25.0"
# The implementation under change; the platform names openkal-uefi by version.
openkal-uefi = { path = "../..", override = true }

# The arrangement with no C library, on this repository's board (examples/board). An application
# with the C library and C++ run-time names openkal-platform instead (README).
[target.x86_64-uefi]
platform = { path = "../board" }
