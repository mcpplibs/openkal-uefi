[package]
name    = "hello"
version = "0.2.0"

[targets.hello]
kind = "bin"
main = "src/main.cpp"

[dependencies]
openkal = "^0.25.0"
# The implementation under change; the platform names openkal-uefi by version.
openkal-uefi = { path = "../..", override = true }

[target.x86_64-uefi]
platform = "openkal-uefi-platform@0.1.0"
